name: Publish image

# Two variants of the same commit are published:
#   ghcr.io/<owner>/helyx:<version>            dashboard off — the default
#   ghcr.io/<owner>/helyx:<version>-dashboard  dashboard on
#
# Version tags are always written. `latest` is published in addition to a
# version tag, never instead of one, so a deployment can always name exactly
# what it runs.
#
# NOTE — one manual step after the first successful run: a GHCR package is
# private even under a public repository, and its visibility does not inherit.
# Until it is switched to public in the package settings, every external
# `docker pull` fails with an unhelpful authentication error.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.2.3)"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            with_dashboard: "false"
            suffix: ""
          - variant: dashboard
            with_dashboard: "true"
            suffix: "-dashboard"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Built-in token — no separate account or stored PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            WITH_DASHBOARD=${{ matrix.with_dashboard }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}${{ matrix.suffix }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
